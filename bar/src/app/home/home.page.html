<div class="login-back">
  <div class="logo-container">
    <img class="logo" src="/assets/images/logo.png" />
  </div>
  <div class="login-container">
    <ion-grid>
      <ion-row style="text-align: center">
        <ion-col
          size="12"
          style="font-weight: bold; font-size: 36px; margin-top: 50px"
          >Login</ion-col
        >
        <ion-col size="12" style="font-size: 16px; margin-bottom: 15px"
          >Ingresa para continuar</ion-col
        >
      </ion-row>

      @if (selectedSegment === 'empleados') {
      <form [formGroup]="nForm" (ngSubmit)="login()">
        <ion-row>
          <ion-col size="12" class="colInput">
            <ion-label class="label"> ID </ion-label>
            <ion-input
              required
              aria-label="ID"
              type="number"
              [clearInput]="true"
              formControlName="idUsuario"
            ></ion-input>
          </ion-col>
          <ion-col size="12" class="colInput">
            <ion-label> Password </ion-label>
            <ion-input
              required
              aria-label="Password"
              type="Password"
              [clearInput]="true"
              formControlName="contrasena"
            ></ion-input>
          </ion-col>

          <ion-col size="12" class="colInput">
            <ion-button
              expand="block"
              color="dark"
              style="margin-bottom: 60px"
              type="submit"
            >
              Ingresar
            </ion-button>
          </ion-col>
        </ion-row>
      </form>
      }

      @if (selectedSegment === 'mesas') {
        <form [formGroup]="mesaForm" (ngSubmit)="loginMesa()">
          <ion-row class="ion-margin">
            <ion-col size="12" class="colInput">
              <ion-label class="label"> ID Mesa </ion-label>
              <ion-input
                required
                aria-label="ID"
                type="number"
                [clearInput]="true"
                formControlName="idMesa"
              ></ion-input>
            </ion-col>


            <ion-col size="12" class="colInput">
              <ion-button
                expand="block"
                color="dark"
                style="margin-bottom: 70px"
                type="submit"
              >
                Ingresar
              </ion-button>
            </ion-col>
          </ion-row>
        </form>
      }



      <ion-segment class="segment" (ionChange)="segmentChanged($event)">
        <ion-segment-button value="empleados">
          <ion-label> Empleados </ion-label>
        </ion-segment-button>
        <ion-segment-button value="mesas">
          <ion-label> Mesas </ion-label>
        </ion-segment-button>
      </ion-segment>
    </ion-grid>
  </div>
</div>
