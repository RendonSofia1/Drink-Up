<div class="block ion-padding">
  <form [formGroup]="nForm" (ngSubmit)="save()">
    <ion-grid>
      <ion-row>
        <ion-col>
          <h1 style="margin-bottom: 0">
            {{ modalType === "edit" ? "Editar Mesa" : "Agregar Mesa" }}
          </h1>
          <p style="margin-top: 3px">
            {{ modalType === "edit" ? "Modificación de mesa" : "Agregar mesa" }}
          </p>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="12">
          <ion-label position="stacked" class="input-label">Nombre</ion-label>
        </ion-col>
        <ion-col size="12">
          <ion-input
            type="text"
            fill="outline"
            name="name"
            formControlName="nombreMesa"
            required
          ></ion-input>
        </ion-col>
        <ion-col size="12">
          <ion-label position="stacked" class="input-label">Mesero</ion-label>
        </ion-col>
        <ion-col size="12">
          <ion-select
            aria-label="Mesero"
            fill="outline"
            interface="popover"
            placeholder="Selecciona un mesero"
            name="waiter"
            formControlName="fkIdUsuario"
            required
          >
            @for (mesero of listaMeseros; track $index) {
            <ion-select-option [value]="mesero.idUsuario"
              >{{ mesero.nombreUsuario }} {{ mesero.apellidoPat }}
              {{ mesero.apellidoMat }}</ion-select-option
            >
            }
          </ion-select>
        </ion-col>
      </ion-row>
      <ion-row style="margin-top: 10px">
        <ion-col size="12">
          <ion-button expand="block" class="btn-save" type="submit"
            >Guardar</ion-button
          >
        </ion-col>
        <ion-col size="12">
          <ion-button
            expand="block"
            fill="outline"
            class="btn-cancel"
            (click)="dismissModal()"
            >Cancelar</ion-button
          >
        </ion-col>
      </ion-row>
    </ion-grid>
  </form>
</div>
