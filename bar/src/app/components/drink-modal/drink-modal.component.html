<div class="block ion-padding">
  <form [formGroup]="nForm" (ngSubmit)="save()">
    <ion-grid>
      <ion-row>
        <ion-col>
          <h1 style="margin-bottom: 0">
            {{ modalType === "edit" ? "Editar Bebida" : "Agregar Bebida" }}
          </h1>
          <p style="margin-top: 3px">
            {{
              modalType === "edit" ? "Modificación de Bebida" : "Agregar Bebida"
            }}
          </p>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="12">
          <ion-label position="stacked" class="input-label">Nombre</ion-label>
        </ion-col>
        <ion-col size="12">
          <ion-input
            type="text"
            fill="outline"
            formControlName="nombreBebida"
          ></ion-input>
        </ion-col>
        <ion-col size="12">
          <ion-label position="stacked" class="input-label">Precio</ion-label>
        </ion-col>
        <ion-col size="12">
          <ion-input
            type="number"
            fill="outline"
            (ionInput)="restrictDecimals($event)"
            formControlName="precioBebida"
          ></ion-input>
        </ion-col>
        <ion-col size="12">
          <ion-label position="stacked" class="input-label">Url Imagen</ion-label>
        </ion-col>
        <ion-col size="12">
          <ion-input
            type="url"
            fill="outline"
            formControlName="url"
          ></ion-input>
        </ion-col>
      </ion-row>
      <ion-row style="margin-top: 10px">
        <ion-col size="12">
          <ion-button expand="block" class="btn-save" type="submit"
            >Guardar</ion-button
          >
        </ion-col>
        <ion-col size="12">
          <ion-button
            expand="block"
            fill="outline"
            class="btn-cancel"
            (click)="dismissModal()"
            >Cancelar</ion-button
          >
        </ion-col>
      </ion-row>
    </ion-grid>
  </form>
</div>
