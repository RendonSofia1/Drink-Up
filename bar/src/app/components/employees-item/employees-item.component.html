<ion-item>
  <div slot="start">
    <ion-label>
      <h2>
        {{ empleado.nombreUsuario }} {{ empleado.apellidoPat }}
        {{ empleado.apellidoMat }}
      </h2>
      <p>ID: {{empleado.idUsuario}}</p>
      <p>{{ getRoleString(empleado.rol) }}</p>
    </ion-label>
  </div>
  <div slot="end">
    <ion-button fill="clear" color="danger" (click)="presentDeleteAlert(empleado.idUsuario)">
      <ion-icon name="trash"> </ion-icon>
    </ion-button>
    <ion-button fill="clear" color="primary" (click)="openModalEdit(empleado)">
      <ion-icon name="pencil" color="warning"></ion-icon>
    </ion-button>
  </div>
</ion-item>
